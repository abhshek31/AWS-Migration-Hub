    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: "Aurora Postgresql Custom paramater group"
      Family: "aurora-postgresql15"
      Parameters:
        log_rotation_age: '1440'
        log_rotation_size: '102400'
        log_statement: 'all'     # Options: none, ddl, mod, all
        log_min_duration_statement: '1000' # Logs queries taking longer than 1000ms (1 second)
      Tags:
      - Key: Name
        Value:
          Fn::Join:
          - "-"
          - - Ref: AWS::StackName
            - AuPGNodeParams
  
