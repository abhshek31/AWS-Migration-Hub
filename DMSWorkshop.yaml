    Properties:
      Description: "Aurora Postgresql Custom paramater group"
      Family: "aurora-postgresql15"
      Parameters:
         rds.babelfish_status: 'on'
         babelfishpg_tsql.migration_mode: 'multi-db'
         shared_preload_libraries: 'pg_stat_statements,pg_hint_plan'
      Tags:
      - Key: Name
        Value:
          Fn::Join:
          - "-"
          - - Ref: AWS::StackName
            - AuPGClusterParams
