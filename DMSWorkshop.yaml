    Condition: Oracle-Source
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DMSDNS
      Name: !Sub 'oracle.${AWS::StackName}.dms.com'
      Type: CNAME
      TTL: '300'
      ResourceRecords: 
