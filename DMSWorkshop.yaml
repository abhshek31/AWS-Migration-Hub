    Properties:
      DataProviderIdentifier: !Sub 'dms-oraclesource-prebuilt-${AWS::StackName}'
      DataProviderName: !Sub 'dms-oraclesource-prebuilt-${AWS::StackName}'
      Description: dms-oraclesource-prebuilt
      Engine: oracle
      Settings: 
          OracleSettings: 
            DatabaseName: ORACLEDB
            Port: 1521
