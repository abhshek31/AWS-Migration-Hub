#      Name: 'dmsdns.com'
      Name: !Sub '${AWS::StackName}.dms.com'
      VPCs: 
        - 
          VPCId: !Ref DmsVpc
          VPCRegion: !Ref AWS::Region
      HostedZoneTags: 
        - 
          Key: 'DMSKey1'
          Value: 'DMSValue1'
        - 
          Key: 'DMSKey2'
          Value: 'DMSValue2'

