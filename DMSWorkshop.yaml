  LinuxMultiDBInstancePublicDNS:
    Description: Public DNS endpoint for the Linux EC2 with DB2, MySQL, and Postgres sources
    Value:
      Fn::GetAtt:
      - EC2MultiInstance
      - PublicDnsName
